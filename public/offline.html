<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7a2e1e" />
    <title>You’re offline · Book Ledger</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        margin: 0;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background: Canvas;
        color: CanvasText;
        font: 16px/1.6 system-ui, sans-serif;
        text-align: center;
      }
      main { width: min(100%, 360px); }
      img { width: 48px; height: 48px; }
      h1 { margin: 24px 0 8px; font-family: Georgia, serif; font-size: 30px; line-height: 1.2; }
      p { margin: 0; opacity: 0.72; }
      button {
        margin-top: 24px;
        padding: 10px 18px;
        border: 1px solid ButtonText;
        border-radius: 6px;
        background: ButtonFace;
        color: ButtonText;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/book-ledger-icon.svg" alt="Book Ledger" />
      <h1>You’re offline</h1>
      <p>Book Ledger will be right here when your connection is back. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
